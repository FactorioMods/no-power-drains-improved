remove-drain-inserter=Remove inserter idle drain
remove-drain-pump=Remove pump idle drain
remove-drain-beacon=Reduce beacon power usage
remove-drain-roboport=Remove roboport power usage
remove-drain-radar=Reduce power usage of all radars
remove-drain-radar-only-if-no-scan=Reduce power usage of vision-only radars
