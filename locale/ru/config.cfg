remove-drain-assembling-machine=Убрать потребление сборочных автоматов в простое
remove-drain-electric-turret=Убрать потребление электрических турелей в простое
remove-drain-furnace=Убрать потребление электропечей в простое
remove-drain-inserter=Убрать потребление манипуляторов в простое
remove-drain-pump=Убрать потребление насосов в простое
remove-drain-beacon=Снизить энергопотребление маяков
remove-drain-roboport=Убрать энергопотребление робопортов
remove-drain-radar=Снизить энергопотребление всех радаров
remove-drain-radar-only-if-no-scan=Снизить потребление радаров без дальнего сканирования
