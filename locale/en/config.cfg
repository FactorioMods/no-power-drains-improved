[mod-setting-description]
remove-drain-assembling-machine=Removes idle electric drain; crafting power consumption stays unchanged.
remove-drain-electric-turret=Removes idle drain; firing still consumes energy.
remove-drain-furnace=Removes idle drain; smelting power consumption stays unchanged.
remove-drain-inserter=Removes idle drain; movement still consumes energy.
remove-drain-pump=Removes idle electric drain; pumping power consumption stays unchanged.
remove-drain-beacon=Removes electric drain and reduces energy_usage to 1 W, including working consumption.
remove-drain-roboport=Removes electric drain and sets energy_usage to zero. Robot charging properties are not changed.
remove-drain-radar=Reduces all radars to 1 W, nearby-scan energy to 1 J and sector-scan energy to 30 J. Overrides the vision-only restriction.
remove-drain-radar-only-if-no-scan=Applies radar power reductions only when sector-scan range does not exceed nearby vision range. All-radars setting takes precedence.
remove-drain-lightning-attractor=Removes electric drain if the prototype has an electric energy source. Does not change lightning capture or storage properties.
