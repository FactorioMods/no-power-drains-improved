[mod-setting-description]
remove-drain-assembling-machine=Убирает электрическое потребление в простое. Расход энергии при производстве не меняется.
remove-drain-electric-turret=Убирает расход энергии в простое. Стрельба по-прежнему требует энергии.
remove-drain-furnace=Убирает расход в простое. Плавка по-прежнему требует энергии.
remove-drain-inserter=Убирает расход в простое. Движение по-прежнему требует энергии.
remove-drain-pump=Убирает расход в простое. Расход при перекачке не меняется.
remove-drain-beacon=Убирает электрическое потребление в простое и снижает energy_usage до 1 Вт, включая рабочее потребление.
remove-drain-roboport=Убирает потребление в простое и устанавливает energy_usage в ноль. Параметры зарядки роботов не меняются.
remove-drain-radar=Снижает потребление всех радаров до 1 Вт, энергию ближнего обзора до 1 Дж и сканирования сектора до 30 Дж. Не ограничивается радарами без дальнего сканирования.
remove-drain-radar-only-if-no-scan=Снижает потребление только если дальность сканирования секторов не превышает ближний обзор. Настройка всех радаров имеет приоритет.
remove-drain-lightning-attractor=Убирает потребление в простое при наличии электрического источника энергии. Не меняет параметры захвата молний или хранения энергии.
